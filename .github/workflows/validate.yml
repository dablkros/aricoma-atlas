name: Validate Aricoma Atlas

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Atlas
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # Repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # Python syntax
      # ---------------------------------------------------------------------

      - name: Validate Python syntax
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile atlas/*.py
          python3 -m py_compile tests/*.py

      - name: Test ingress deployment and certificate validation
        run: python3 -m unittest discover -s tests -v

      # ---------------------------------------------------------------------
      # Atlas configuration files
      # ---------------------------------------------------------------------

      - name: Validate Atlas YAML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("catalog/manifest.yaml"),
              Path("catalog/baseline/custom_field_choice_sets.yaml"),
              Path("catalog/baseline/custom_fields.yaml"),
              Path("deployment/netbox.yaml"),
              Path("deployment/oxidized.yaml"),
              Path("deployment/proxy.example.yaml"),
          ]

          for path in files:
              if not path.exists():
                  raise SystemExit(
                      f"[ERROR] Missing required file: {path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as handle:
                  data = yaml.safe_load(handle)

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"[ERROR] Invalid YAML root in {path}"
                  )

              print(f"[OK] {path}")

          print("[OK] Atlas YAML validation completed")
          PY

      # ---------------------------------------------------------------------
      # OpenBao deployment
      # ---------------------------------------------------------------------

      - name: Validate OpenBao deployment files
        run: |
          required_files=(
            deployment/openbao/docker-compose.yml
            deployment/openbao/openbao.hcl
            deployment/openbao/policies/atlas-deployer.hcl
            deployment/openbao/policies/atlas-operator.hcl
            deployment/openbao/policies/device-credentials-read.hcl
            deployment/openbao/policies/netbox-runtime.hcl
            deployment/openbao/policies/checkmk-runtime.hcl
            deployment/openbao/policies/oxidized-runtime.hcl
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "[ERROR] Missing required file: ${file}"
              exit 1
            fi

            echo "[OK] ${file}"
          done

      - name: Validate OpenBao Docker Compose
        run: |
          docker compose \
            -f deployment/openbao/docker-compose.yml \
            config \
            --quiet

          echo "[OK] OpenBao Docker Compose configuration valid"

      - name: Validate OpenBao server configuration
        run: |
          OPENBAO_IMAGE="$(docker compose -f deployment/openbao/docker-compose.yml config --images | head -n 1)"

          if [ -z "${OPENBAO_IMAGE}" ]; then
            echo "[ERROR] Unable to determine OpenBao image"
            exit 1
          fi

          echo "OpenBao image: ${OPENBAO_IMAGE}"

          docker run --rm -v "${PWD}/deployment/openbao:/openbao/config:ro" "${OPENBAO_IMAGE}" operator validate-config -config=/openbao/config/openbao.hcl

          echo "[OK] OpenBao server configuration valid"

      # ---------------------------------------------------------------------
      # Upstream Device Type Library
      # ---------------------------------------------------------------------

      - name: Read pinned upstream configuration
        id: upstream
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          with open(
              "catalog/manifest.yaml",
              "r",
              encoding="utf-8",
          ) as handle:
              manifest = yaml.safe_load(handle)

          upstream = manifest["upstream"]

          repository = upstream["repository"]
          commit = upstream["commit"]

          print(f"repository={repository}")
          print(f"commit={commit}")
          PY

      - name: Clone pinned Device Type Library
        env:
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          echo "Repository: ${UPSTREAM_REPOSITORY}"
          echo "Commit:     ${UPSTREAM_COMMIT}"

          git clone \
            "${UPSTREAM_REPOSITORY}" \
            devicetype-library

          git -C devicetype-library \
            checkout \
            "${UPSTREAM_COMMIT}"

          ACTUAL_COMMIT="$(
            git -C devicetype-library rev-parse HEAD
          )"

          if [ "${ACTUAL_COMMIT}" != "${UPSTREAM_COMMIT}" ]; then
            echo "[ERROR] Upstream commit mismatch"
            echo "Expected: ${UPSTREAM_COMMIT}"
            echo "Actual:   ${ACTUAL_COMMIT}"
            exit 1
          fi

          echo "[OK] Pinned upstream commit verified"

      # ---------------------------------------------------------------------
      # Atlas Device Catalog
      # ---------------------------------------------------------------------

      - name: Build Atlas Device Catalog
        run: |
          python3 scripts/build_catalog.py

      - name: Audit Atlas Device Catalog
        run: |
          python3 scripts/audit_catalog.py

      - name: Audit component fields
        run: |
          python3 scripts/audit_component_fields.py

      # ---------------------------------------------------------------------
      # Build result
      # ---------------------------------------------------------------------

      - name: Verify generated catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build/device-types")

          if not root.exists():
              raise SystemExit(
                  "[ERROR] build/device-types does not exist"
              )

          files = list(
              root.glob("*/*.yaml")
          )

          if not files:
              raise SystemExit(
                  "[ERROR] Generated catalog is empty"
              )

          vendors = {}

          for path in files:
              vendor = path.parent.name

              vendors[vendor] = (
                  vendors.get(vendor, 0)
                  + 1
              )

          print()
          print("Generated Atlas Device Catalog")
          print("=" * 50)

          for vendor in sorted(vendors):
              print(
                  f"{vendor:<20}"
                  f"{vendors[vendor]:>6}"
              )

          print("-" * 50)
          print(
              f"{'TOTAL':<20}"
              f"{len(files):>6}"
          )

          print()
          print("[OK] Generated catalog verified")
          PY

  openbao-integration:
    name: OpenBao integration
    runs-on: ubuntu-latest
    needs:
      - validate
    timeout-minutes: 10

    steps:
      # ---------------------------------------------------------------------
      # Repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # OpenBao fresh deployment
      # ---------------------------------------------------------------------

      - name: Deploy fresh OpenBao
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_openbao.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

      # ---------------------------------------------------------------------
      # OpenBao verification
      # ---------------------------------------------------------------------

      - name: Verify OpenBao health
        run: |
          python3 - <<'PY'
          import requests

          response = requests.get(
              "http://127.0.0.1:18200/v1/sys/health",
              timeout=10,
          )

          if response.status_code != 200:
              raise SystemExit(
                  "[ERROR] OpenBao health endpoint returned "
                  f"HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if not data.get("initialized"):
              raise SystemExit(
                  "[ERROR] OpenBao is not initialized"
              )

          if data.get("sealed"):
              raise SystemExit(
                  "[ERROR] OpenBao is sealed"
              )

          print("[OK] OpenBao initialized")
          print("[OK] OpenBao unsealed")
          print("[OK] OpenBao health endpoint verified")
          PY

      # ---------------------------------------------------------------------
      # Idempotency
      # ---------------------------------------------------------------------

      - name: Verify second OpenBao deployment
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_openbao.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

          echo "[OK] Second OpenBao deployment completed"

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------

      - name: Clean up OpenBao
        if: always()
        run: |
          docker compose \
            -f deployment/openbao/docker-compose.yml \
            down \
            -v \
            --remove-orphans

  oxidized-ingress-integration:
    name: Oxidized HTTPS ingress integration
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies and prepare ephemeral TLS
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/ci_ingress.py fixtures --empty-inventory
          printf '%s\n' '127.0.0.1 netbox.atlas.test oxidized.atlas.test' | sudo tee -a /etc/hosts > /dev/null
      - name: Deploy OpenBao
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/deploy_openbao.py 2>&1 | sed -E 's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'
      - name: Verify protected ingress with empty device inventory
        run: |
          python3 scripts/deploy_oxidized.py
          python3 scripts/deploy_proxy.py
          python3 scripts/ci_ingress.py waiting
      - name: Start native Oxidized with a non-collecting loopback fixture
        run: |
          python3 scripts/ci_ingress.py fixtures
          python3 scripts/deploy_oxidized.py
          python3 scripts/deploy_proxy.py
          python3 scripts/ci_ingress.py snapshot --oxidized-only
      - name: Verify redeployment, persistence and network restrictions
        run: |
          python3 scripts/deploy_oxidized.py
          python3 scripts/deploy_proxy.py
          python3 scripts/ci_ingress.py compare --oxidized-only
          python3 scripts/ci_ingress.py deny-network
      - name: Clean up isolated integration environment
        if: always()
        run: |
          for component in proxy oxidized; do
            if [ -f ".runtime/${component}/docker-compose.yml" ]; then
              docker compose -p "atlas-${component}" -f ".runtime/${component}/docker-compose.yml" down -v --remove-orphans || true
            fi
          done
          docker compose -f deployment/openbao/docker-compose.yml down -v --remove-orphans || true

  atlas-integration:
    name: Full Atlas integration
    runs-on: ubuntu-latest
    needs:
      - validate
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------------
      # Repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # Python
      # ---------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # Fresh Atlas deployment
      # ---------------------------------------------------------------------

      - name: Prepare ephemeral CI certificates and DNS
        run: |
          python3 scripts/ci_ingress.py fixtures
          printf '%s\n' '127.0.0.1 netbox.atlas.test oxidized.atlas.test' | sudo tee -a /etc/hosts > /dev/null

      - name: Verify prepare-only does not start application containers
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/deploy_atlas.py --prepare-only 2>&1 \
            | sed -E 's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'
          for component in netbox oxidized proxy; do
            if docker ps --filter "label=com.docker.compose.project=atlas-${component}" --format '{{.ID}}' | grep -q .; then
              echo "[ERROR] prepare-only started ${component} containers"
              exit 1
            fi
          done

      - name: Deploy fresh Atlas
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_atlas.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

      # ---------------------------------------------------------------------
      # OpenBao verification
      # ---------------------------------------------------------------------

      - name: Verify OpenBao
        run: |
          python3 - <<'PY'
          import requests

          response = requests.get(
              "http://127.0.0.1:18200/v1/sys/health",
              timeout=10,
          )

          if response.status_code != 200:
              raise SystemExit(
                  "[ERROR] OpenBao health endpoint returned "
                  f"HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if not data.get("initialized"):
              raise SystemExit(
                  "[ERROR] OpenBao is not initialized"
              )

          if data.get("sealed"):
              raise SystemExit(
                  "[ERROR] OpenBao is sealed"
              )

          print("[OK] OpenBao initialized")
          print("[OK] OpenBao unsealed")
          print("[OK] OpenBao health verified")
          PY

      # ---------------------------------------------------------------------
      # NetBox verification
      # ---------------------------------------------------------------------

      - name: Verify NetBox API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import requests

          from atlas.openbao_client import OpenBaoClient

          identity_file = Path(
              ".runtime/openbao-approle.json"
          )

          if not identity_file.exists():
              raise SystemExit(
                  "[ERROR] Atlas OpenBao identity not found"
              )

          client = OpenBaoClient(
              "http://127.0.0.1:18200"
          )

          openbao_token = client.login_from_identity(
              identity_file
          )

          secret = client.kv_read(
              openbao_token,
              "netbox/api",
          )

          netbox_token = secret.get("token")

          if not netbox_token:
              raise SystemExit(
                  "[ERROR] NetBox API token not found in OpenBao"
              )

          if netbox_token.startswith("nbt_"):
              authorization = f"Bearer {netbox_token}"
          else:
              authorization = f"Token {netbox_token}"

          response = requests.get(
              (
                  "http://127.0.0.1:8000"
                  "/api/users/users/?limit=1"
              ),
              headers={
                  "Authorization": authorization,
                  "Accept": "application/json",
              },
              timeout=15,
          )

          if response.status_code != 200:
              raise SystemExit(
                  "[ERROR] Authenticated NetBox API request returned "
                  f"HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if not isinstance(data, dict):
              raise SystemExit(
                  "[ERROR] NetBox API returned invalid JSON"
              )

          print("[OK] NetBox API authentication successful")
          print("[OK] NetBox API token from OpenBao verified")
          PY

      # ---------------------------------------------------------------------
      # Idempotency
      # ---------------------------------------------------------------------

      - name: Verify ingress and seed Oxidized persistence check
        run: python3 scripts/ci_ingress.py snapshot

      - name: Verify second Atlas deployment
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_atlas.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

          echo "[OK] Second Atlas deployment completed"

      # ---------------------------------------------------------------------
      # Final verification
      # ---------------------------------------------------------------------

      - name: Verify ingress and preserved Oxidized state
        run: python3 scripts/ci_ingress.py compare

      - name: Verify containers
        run: |
          docker ps

          if ! docker ps \
            --filter "name=atlas-netbox-netbox" \
            --format '{{.Names}}' \
            | grep -q .; then

            echo "[ERROR] NetBox container not running"
            exit 1
          fi

          if ! docker ps \
            --filter "name=openbao" \
            --format '{{.Names}}' \
            | grep -q .; then

            echo "[ERROR] OpenBao container not running"
            exit 1
          fi

          echo "[OK] Atlas containers running"

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------

      - name: Clean up Atlas
        if: always()
        shell: bash
        run: |
          for component in proxy oxidized; do
            if [ -f ".runtime/${component}/docker-compose.yml" ]; then
              docker compose -p "atlas-${component}" -f ".runtime/${component}/docker-compose.yml" down -v --remove-orphans || true
            fi
          done
          if [ -d ".runtime/netbox-docker" ]; then
            (
              cd .runtime/netbox-docker

              docker compose \
                -p atlas-netbox \
                down \
                -v \
                --remove-orphans
            ) || true
          fi

          docker compose \
            -f deployment/openbao/docker-compose.yml \
            down \
            -v \
            --remove-orphans \
            || true

  netbox-upgrade-integration:
    name: NetBox upgrade integration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - validate
    timeout-minutes: 35

    steps:
      # ---------------------------------------------------------------------
      # Repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      # ---------------------------------------------------------------------
      # Deploy BASE version
      # ---------------------------------------------------------------------

      - name: Checkout PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "${BASE_SHA}"

          echo "BASE commit:"
          git rev-parse HEAD

      - name: Install BASE dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Deploy BASE Atlas
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_atlas.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

      # ---------------------------------------------------------------------
      # Seed persistent NetBox data
      # ---------------------------------------------------------------------

      - name: Create upgrade test data
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import requests

          from atlas.openbao_client import OpenBaoClient

          identity_file = Path(
              ".runtime/openbao-approle.json"
          )

          client = OpenBaoClient(
              "http://127.0.0.1:18200"
          )

          openbao_token = client.login_from_identity(
              identity_file
          )

          secret = client.kv_read(
              openbao_token,
              "netbox/api",
          )

          netbox_token = secret["token"]

          if netbox_token.startswith("nbt_"):
              authorization = f"Bearer {netbox_token}"
          else:
              authorization = f"Token {netbox_token}"

          headers = {
              "Authorization": authorization,
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          payload = {
              "name": "CI Upgrade Test",
              "slug": "ci-upgrade-test",
              "description": (
                  "Persistent object created by "
                  "Aricoma Atlas upgrade CI"
              ),
          }

          response = requests.post(
              "http://127.0.0.1:8000/api/dcim/sites/",
              headers=headers,
              json=payload,
              timeout=30,
          )

          if response.status_code not in {200, 201}:
              raise SystemExit(
                  "[ERROR] Unable to create upgrade test site: "
                  f"HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if data.get("slug") != "ci-upgrade-test":
              raise SystemExit(
                  "[ERROR] Upgrade test site response is invalid"
              )

          print("[OK] Persistent NetBox test data created")
          PY

      # ---------------------------------------------------------------------
      # Switch repository to PR HEAD
      # ---------------------------------------------------------------------

      - name: Checkout PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "${HEAD_SHA}"

          echo "HEAD commit:"
          git rev-parse HEAD

          if [ ! -d ".runtime" ]; then
            echo "[ERROR] Atlas runtime disappeared during checkout"
            exit 1
          fi

          echo "[OK] Existing Atlas runtime preserved"

      - name: Install HEAD dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Prepare HEAD ingress certificates and DNS
        run: |
          python3 scripts/ci_ingress.py fixtures
          printf '%s\n' '127.0.0.1 netbox.atlas.test oxidized.atlas.test' | sudo tee -a /etc/hosts > /dev/null

      # ---------------------------------------------------------------------
      # Upgrade existing Atlas deployment
      # ---------------------------------------------------------------------

      - name: Upgrade Atlas to PR version
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_atlas.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

      # ---------------------------------------------------------------------
      # Verify persisted data
      # ---------------------------------------------------------------------

      - name: Verify data survived upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import requests

          from atlas.openbao_client import OpenBaoClient

          identity_file = Path(
              ".runtime/openbao-approle.json"
          )

          client = OpenBaoClient(
              "http://127.0.0.1:18200"
          )

          openbao_token = client.login_from_identity(
              identity_file
          )

          secret = client.kv_read(
              openbao_token,
              "netbox/api",
          )

          netbox_token = secret["token"]

          if netbox_token.startswith("nbt_"):
              authorization = f"Bearer {netbox_token}"
          else:
              authorization = f"Token {netbox_token}"

          response = requests.get(
              (
                  "http://127.0.0.1:8000"
                  "/api/dcim/sites/"
                  "?slug=ci-upgrade-test"
              ),
              headers={
                  "Authorization": authorization,
                  "Accept": "application/json",
              },
              timeout=30,
          )

          if response.status_code != 200:
              raise SystemExit(
                  "[ERROR] Unable to verify upgrade test data: "
                  f"HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if data.get("count") != 1:
              raise SystemExit(
                  "[ERROR] Persistent NetBox test site "
                  "did not survive upgrade"
              )

          site = data["results"][0]

          if site.get("slug") != "ci-upgrade-test":
              raise SystemExit(
                  "[ERROR] Persisted NetBox site is invalid"
              )

          print("[OK] NetBox data survived upgrade")
          PY

      # ---------------------------------------------------------------------
      # Idempotency after upgrade
      # ---------------------------------------------------------------------

      - name: Verify upgraded ingress and seed Oxidized persistence check
        run: python3 scripts/ci_ingress.py snapshot

      - name: Verify post-upgrade idempotency
        shell: bash
        run: |
          set -o pipefail

          python3 scripts/deploy_atlas.py 2>&1 \
            | sed -E \
              's/^(Unseal Key [0-9]+: ).*/\1[REDACTED]/'

          echo "[OK] Post-upgrade deployment is idempotent"

      - name: Verify post-upgrade ingress and preserved Oxidized state
        run: python3 scripts/ci_ingress.py compare

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------

      - name: Clean up upgrade environment
        if: always()
        shell: bash
        run: |
          for component in proxy oxidized; do
            if [ -f ".runtime/${component}/docker-compose.yml" ]; then
              docker compose -p "atlas-${component}" -f ".runtime/${component}/docker-compose.yml" down -v --remove-orphans || true
            fi
          done
          if [ -d ".runtime/netbox-docker" ]; then
            (
              cd .runtime/netbox-docker

              docker compose \
                -p atlas-netbox \
                down \
                -v \
                --remove-orphans
            ) || true
          fi

          docker compose \
            -f deployment/openbao/docker-compose.yml \
            down \
            -v \
            --remove-orphans \
            || true
