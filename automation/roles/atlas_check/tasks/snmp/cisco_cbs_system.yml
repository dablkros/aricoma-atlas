---
- name: Read allow-listed Cisco CBS system OIDs
  atlas_snmp_get:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default(161) }}"
    community: "{{ lookup('ansible.builtin.env', 'ATLAS_SNMP_COMMUNITY') }}"
    queries:
      sys_object_id: 1.3.6.1.2.1.1.2.0
      cpu_one_second: 1.3.6.1.4.1.9.6.1.101.1.7.0
      cpu_one_minute: 1.3.6.1.4.1.9.6.1.101.1.8.0
      cpu_five_minutes: 1.3.6.1.4.1.9.6.1.101.1.9.0
      temperature: 1.3.6.1.4.1.9.6.1.101.53.15.1.10.1
      fan_1: 1.3.6.1.4.1.9.6.1.101.53.15.1.4.1
      fan_2: 1.3.6.1.4.1.9.6.1.101.53.15.1.5.1
      fan_3: 1.3.6.1.4.1.9.6.1.101.53.15.1.6.1
  register: atlas_snmp
  delegate_to: localhost

- name: Normalize Cisco CBS SNMP collector payload
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        model: "{{ atlas_device_model | default('') }}"
        sys_object_id: "{{ atlas_snmp.values.sys_object_id.value | default('') }}"
        metrics: "{{ atlas_snmp.values }}"
