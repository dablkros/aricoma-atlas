---
- name: Initialize Cisco IOS resource command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco IOS resource and environment commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_ios_command.yml"
  loop:
    - {key: show_processes_cpu, command: show processes cpu}
    - {key: show_processes_memory_sorted, command: show processes memory sorted}
    - {key: show_environment_all, command: show environment all}
    - {key: show_power_inline, command: show power inline}
    - {key: show_post, command: show post}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco IOS resource outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"
