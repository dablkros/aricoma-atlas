---
- name: Collect Cisco IOS resource and environment commands
  atlas_cisco_readonly_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
    commands:
      - show processes cpu
      - show processes memory sorted
      - show environment all
      - show power inline
      - show post
  register: atlas_ios_resources
  changed_when: false

- name: Prepare Cisco IOS resource outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_processes_cpu: "{{ atlas_ios_resources.stdout[0] }}"
        show_processes_memory_sorted: "{{ atlas_ios_resources.stdout[1] }}"
        show_environment_all: "{{ atlas_ios_resources.stdout[2] }}"
        show_power_inline: "{{ atlas_ios_resources.stdout[3] }}"
        show_post: "{{ atlas_ios_resources.stdout[4] }}"
