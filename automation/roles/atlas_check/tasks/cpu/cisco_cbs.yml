---
- name: Collect Cisco CBS CPU utilization
  community.ciscosmb.command:
    commands:
      - show cpu utilization
  register: atlas_cisco_cpu
  changed_when: false

- name: Prepare Cisco CBS CPU output for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      raw_output: "{{ atlas_cisco_cpu.stdout[0] }}"
