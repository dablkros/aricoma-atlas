---
- name: Collect FortiOS local compliance status through SSH
  atlas_fortios_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    commands:
      - get system status
      - get vpn certificate local details
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
  register: atlas_fortios_compliance
  changed_when: false

- name: Prepare FortiOS compliance outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        get_system_status: "{{ atlas_fortios_compliance.outputs['get system status'] }}"
        get_vpn_certificate_local_details: "{{ atlas_fortios_compliance.outputs['get vpn certificate local details'] }}"
