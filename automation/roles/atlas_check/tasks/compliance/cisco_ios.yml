---
- name: Collect Cisco IOS local compliance commands
  atlas_cisco_readonly_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
    commands:
      - show license summary
      - show license all
      - show crypto pki certificates
  register: atlas_ios_compliance
  changed_when: false

- name: Prepare Cisco IOS compliance outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_license_summary: "{{ atlas_ios_compliance.stdout[0] }}"
        show_license_all: "{{ atlas_ios_compliance.stdout[1] }}"
        show_crypto_pki_certificates: "{{ atlas_ios_compliance.stdout[2] }}"
