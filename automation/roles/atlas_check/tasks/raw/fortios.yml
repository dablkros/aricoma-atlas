---
- name: Collect allow-listed FortiOS raw commands in one protected SSH session
  atlas_fortios_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    commands: "{{ atlas_fortios_raw_commands }}"
    collect_interface_diagnostics: "{{ atlas_fortios_collect_interface_diagnostics | bool }}"
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
    result_path: "{{ atlas_raw_result_path }}"
  register: atlas_fortios_raw_result
  changed_when: false
  # The module marks the password argument no_log and, when result_path is
  # used, returns only safe metadata. Keeping the task result visible preserves
  # authentication, host-key and timeout classification without placing raw
  # CLI output in Runner events.

- name: Prepare FortiOS raw outputs for Atlas validation
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        result_file_written: "{{ atlas_fortios_raw_result.result_file_written | default(false) }}"
