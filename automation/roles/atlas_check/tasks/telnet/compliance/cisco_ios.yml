---
- name: Collect Cisco IOS compliance over explicit Telnet fallback
  ansible.netcommon.telnet:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port }}"
    user: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    login_prompt: "(?i)(?:username|login):\\s*$"
    password_prompt: "(?i)password:\\s*$"
    prompts:
      - "[>#]\\s*$"
    command:
      - terminal length 0
      - show license summary
      - show license all
      - show crypto pki certificates
    timeout: "{{ ansible_command_timeout }}"
  register: atlas_ios_telnet_compliance
  changed_when: false
  no_log: true

- name: Prepare Cisco IOS Telnet compliance outputs for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_license_summary: "{{ atlas_ios_telnet_compliance.output[1] }}"
        show_license_all: "{{ atlas_ios_telnet_compliance.output[2] }}"
        show_crypto_pki_certificates: "{{ atlas_ios_telnet_compliance.output[3] }}"
