---
- name: Collect Cisco IOS resources over explicit Telnet fallback
  ansible.netcommon.telnet:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port }}"
    user: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    login_prompt: "(?i)(?:username|login):\\s*$"
    password_prompt: "(?i)password:\\s*$"
    prompts:
      - "[>#]\\s*$"
    command:
      - terminal length 0
      - show processes cpu
      - show processes memory sorted
      - show environment all
      - show power inline
      - show post
    timeout: "{{ ansible_command_timeout }}"
  register: atlas_ios_telnet_resources
  changed_when: false
  no_log: true

- name: Prepare Cisco IOS Telnet resource outputs for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_processes_cpu: "{{ atlas_ios_telnet_resources.output[1] }}"
        show_processes_memory_sorted: "{{ atlas_ios_telnet_resources.output[2] }}"
        show_environment_all: "{{ atlas_ios_telnet_resources.output[3] }}"
        show_power_inline: "{{ atlas_ios_telnet_resources.output[4] }}"
        show_post: "{{ atlas_ios_telnet_resources.output[5] }}"
