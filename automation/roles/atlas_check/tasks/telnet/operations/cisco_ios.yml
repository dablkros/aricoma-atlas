---
- name: Collect Cisco IOS operations over explicit Telnet fallback
  ansible.netcommon.telnet:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port }}"
    user: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    login_prompt: "(?i)(?:username|login):\\s*$"
    password_prompt: "(?i)password:\\s*$"
    prompts:
      - "[>#]\\s*$"
    command:
      - terminal length 0
      - show clock
      - show ntp status
      - show ntp associations
      - show logging
      - show ip route
      - show ip ospf neighbor
      - show ip bgp summary
      - show ip eigrp neighbors
      - show standby brief
      - show redundancy
      - show switch
      - show switch stack-ports summary
      - dir
      - "show flash: | include crash"
    timeout: "{{ ansible_command_timeout }}"
  register: atlas_ios_telnet_operations
  changed_when: false
  no_log: true

- name: Prepare Cisco IOS Telnet operational outputs for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_clock: "{{ atlas_ios_telnet_operations.output[1] }}"
        show_ntp_status: "{{ atlas_ios_telnet_operations.output[2] }}"
        show_ntp_associations: "{{ atlas_ios_telnet_operations.output[3] }}"
        show_logging: "{{ atlas_ios_telnet_operations.output[4] }}"
        show_ip_route: "{{ atlas_ios_telnet_operations.output[5] }}"
        show_ip_ospf_neighbor: "{{ atlas_ios_telnet_operations.output[6] }}"
        show_ip_bgp_summary: "{{ atlas_ios_telnet_operations.output[7] }}"
        show_ip_eigrp_neighbors: "{{ atlas_ios_telnet_operations.output[8] }}"
        show_standby_brief: "{{ atlas_ios_telnet_operations.output[9] }}"
        show_redundancy: "{{ atlas_ios_telnet_operations.output[10] }}"
        show_switch: "{{ atlas_ios_telnet_operations.output[11] }}"
        show_switch_stack_ports_summary: >-
          {{ atlas_ios_telnet_operations.output[12] }}
        dir: "{{ atlas_ios_telnet_operations.output[13] }}"
        show_flash_crash: "{{ atlas_ios_telnet_operations.output[14] }}"
