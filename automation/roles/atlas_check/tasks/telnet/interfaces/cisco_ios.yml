---
- name: Collect Cisco IOS interfaces over explicit Telnet fallback
  ansible.netcommon.telnet:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port }}"
    user: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    login_prompt: "(?i)(?:username|login):\\s*$"
    password_prompt: "(?i)password:\\s*$"
    prompts:
      - "[>#]\\s*$"
    command:
      - terminal length 0
      - show interfaces
      - show interfaces status
      - show interfaces counters errors
      - show ip interface brief
      - show interfaces transceiver
    timeout: "{{ ansible_command_timeout }}"
  register: atlas_ios_telnet_interfaces
  changed_when: false
  no_log: true

- name: Prepare Cisco IOS Telnet interface outputs for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_interfaces: "{{ atlas_ios_telnet_interfaces.output[1] }}"
        show_interfaces_status: "{{ atlas_ios_telnet_interfaces.output[2] }}"
        show_interfaces_counters_errors: "{{ atlas_ios_telnet_interfaces.output[3] }}"
        show_ip_interface_brief: "{{ atlas_ios_telnet_interfaces.output[4] }}"
        show_interfaces_transceiver: "{{ atlas_ios_telnet_interfaces.output[5] }}"
