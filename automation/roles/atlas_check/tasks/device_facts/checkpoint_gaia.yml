---
- name: Collect Check Point Gaia identity commands through Clish
  atlas_gaia_clish:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    commands:
      - show hostname
      - show asset all
      - show version all
      - show uptime
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
  register: atlas_gaia_facts
  changed_when: false

- name: Prepare Check Point Gaia command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_hostname: "{{ atlas_gaia_facts.outputs['show hostname'] }}"
        show_asset_all: "{{ atlas_gaia_facts.outputs['show asset all'] }}"
        show_version_all: "{{ atlas_gaia_facts.outputs['show version all'] }}"
        show_uptime: "{{ atlas_gaia_facts.outputs['show uptime'] }}"
