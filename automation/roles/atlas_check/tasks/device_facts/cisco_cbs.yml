---
- name: Initialize Cisco CBS identity command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco CBS identity commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_cbs_command.yml"
  loop:
    - {key: show_system, command: show system}
    - {key: show_version, command: show version}
    - {key: show_inventory, command: show inventory}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare individual Cisco CBS command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"

