---
- name: Collect Cisco CBS identity commands
  community.ciscosmb.command:
    commands:
      - show system
      - show version
      - show inventory
  register: atlas_cbs_facts
  changed_when: false

- name: Prepare individual Cisco CBS command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_system: "{{ atlas_cbs_facts.stdout[0] }}"
        show_version: "{{ atlas_cbs_facts.stdout[1] }}"
        show_inventory: "{{ atlas_cbs_facts.stdout[2] }}"

