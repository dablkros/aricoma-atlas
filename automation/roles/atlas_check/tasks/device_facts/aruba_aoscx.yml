---
- name: Collect Aruba AOS-CX identity commands
  arubanetworks.aoscx.aoscx_command:
    commands:
      - show system
      - show version
  register: atlas_aoscx_facts
  changed_when: false

- name: Prepare Aruba AOS-CX command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_system: "{{ atlas_aoscx_facts.stdout[0] }}"
        show_version: "{{ atlas_aoscx_facts.stdout[1] }}"

