---
- name: Collect FortiOS system status
  fortinet.fortios.fortios_monitor_fact:
    access_token: "{{ lookup('ansible.builtin.env', 'ATLAS_FORTIOS_API_TOKEN') }}"
    selector: system_status
    vdom: root
  register: atlas_fortios_facts
  changed_when: false

- name: Collect FortiOS uptime timestamps
  ansible.builtin.uri:
    url: "https://{{ hostvars[inventory_hostname].ansible_host }}:{{ hostvars[inventory_hostname].ansible_httpapi_port }}/api/v2/monitor/web-ui/state"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'ATLAS_FORTIOS_API_TOKEN') }}"
    follow_redirects: none
    return_content: true
    status_code: 200
    timeout: "{{ hostvars[inventory_hostname].ansible_command_timeout }}"
    unredirected_headers:
      - Authorization
    validate_certs: "{{ hostvars[inventory_hostname].ansible_httpapi_validate_certs }}"
  register: atlas_fortios_uptime
  changed_when: false
  delegate_to: localhost
  no_log: true

- name: Prepare FortiOS device facts for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        hostname: "{{ atlas_fortios_facts.meta.results.hostname }}"
        model: "{{ atlas_fortios_facts.meta.results.model_number }}"
        os_version: "{{ atlas_fortios_facts.meta.version | default(atlas_fortios_facts.meta.results.version) }}"
        serial_number: "{{ atlas_fortios_facts.meta.serial }}"
        uptime_state: "{{ atlas_fortios_uptime.json }}"
