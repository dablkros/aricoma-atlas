---
- name: Initialize Cisco IOS identity command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco IOS identity commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_ios_command.yml"
  loop:
    - {key: show_version, command: show version}
    - {key: show_inventory, command: show inventory}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco IOS command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"

