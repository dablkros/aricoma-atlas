---
- name: Collect FortiOS identity and performance status through SSH
  atlas_fortios_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    commands:
      - get system status
      - get system performance status
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
  register: atlas_fortios_facts
  changed_when: false

- name: Prepare FortiOS SSH device facts for Atlas
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        source_transport: ssh
        show_system_status: "{{ atlas_fortios_facts.outputs['get system status'] }}"
        show_performance_status: "{{ atlas_fortios_facts.outputs['get system performance status'] }}"
