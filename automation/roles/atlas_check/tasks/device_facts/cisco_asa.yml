---
- name: Collect Cisco ASA identity commands
  cisco.asa.asa_command:
    commands:
      - show version
      - show inventory
  register: atlas_asa_facts
  changed_when: false

- name: Prepare Cisco ASA command outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_version: "{{ atlas_asa_facts.stdout[0] }}"
        show_inventory: "{{ atlas_asa_facts.stdout[1] }}"
