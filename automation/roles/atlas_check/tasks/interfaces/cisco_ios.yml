---
- name: Initialize Cisco IOS interface command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco IOS interface-health commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_ios_command.yml"
  loop:
    - {key: show_interfaces, command: show interfaces}
    - {key: show_interfaces_status, command: show interfaces status}
    - {key: show_interfaces_counters_errors, command: show interfaces counters errors}
    - {key: show_ip_interface_brief, command: show ip interface brief}
    - {key: show_interfaces_transceiver, command: show interfaces transceiver}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco IOS interface outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"
