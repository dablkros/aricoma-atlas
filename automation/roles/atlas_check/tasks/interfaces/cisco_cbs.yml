---
- name: Initialize Cisco CBS interface command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco CBS interface-health commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_cbs_command.yml"
  loop:
    - {key: show_interfaces_status, command: show interfaces status}
    - {key: show_interfaces_counters, command: show interfaces counters}
    - {key: show_interfaces_description, command: show interfaces description}
    - {key: show_fiber_ports_optical_transceiver, command: show fiber-ports optical-transceiver}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco CBS interface outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"
