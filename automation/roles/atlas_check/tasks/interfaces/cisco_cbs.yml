---
- name: Collect Cisco CBS interface-health commands
  atlas_cisco_readonly_cli:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | int }}"
    username: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'ATLAS_DEVICE_PASSWORD') }}"
    connect_timeout: "{{ ansible_connect_timeout | int }}"
    command_timeout: "{{ ansible_command_timeout | int }}"
    host_key_checking: "{{ ansible_host_key_checking | bool }}"
    known_hosts_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
    commands:
      - show interfaces status
      - show interfaces counters
      - show interfaces description
      - show fiber-ports optical-transceiver
  register: atlas_cbs_interfaces
  changed_when: false

- name: Prepare Cisco CBS interface outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data:
        show_interfaces_status: "{{ atlas_cbs_interfaces.stdout[0] }}"
        show_interfaces_counters: "{{ atlas_cbs_interfaces.stdout[1] }}"
        show_interfaces_description: "{{ atlas_cbs_interfaces.stdout[2] }}"
        show_fiber_ports_optical_transceiver: >-
          {{ atlas_cbs_interfaces.stdout[3] }}
