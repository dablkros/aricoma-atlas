---
- name: Validate the Atlas execution contract
  ansible.builtin.assert:
    that:
      - atlas_schema_version | int == 1
      - atlas_transport in atlas_transport_files
      - atlas_collector in atlas_transport_files[atlas_transport]
      - atlas_platform in atlas_transport_files[atlas_transport][atlas_collector]
    quiet: true

- name: Resolve the allow-listed platform task
  ansible.builtin.set_fact:
    atlas_task_file: >-
      {{ atlas_transport_files[atlas_transport][atlas_collector][atlas_platform] }}

- name: Execute the platform-specific read-only collector
  ansible.builtin.include_tasks: "{{ atlas_task_file }}"

- name: ATLAS_RESULT
  ansible.builtin.set_fact:
    atlas_result:
      schema_version: 1
      collector: "{{ atlas_collector }}"
      platform: "{{ atlas_platform }}"
      status: ok
      data: "{{ atlas_transport_result.data | default(none) }}"
      raw_output: "{{ atlas_transport_result.raw_output | default(none) }}"
      error_code: null
