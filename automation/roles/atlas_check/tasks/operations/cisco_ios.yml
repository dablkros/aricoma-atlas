---
- name: Initialize Cisco IOS operational command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco IOS operational-health commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_ios_command.yml"
  loop:
    - {key: show_clock, command: show clock}
    - {key: show_ntp_status, command: show ntp status}
    - {key: show_ntp_associations, command: show ntp associations}
    - {key: show_logging, command: show logging}
    - {key: show_ip_route, command: show ip route}
    - {key: show_ip_ospf_neighbor, command: show ip ospf neighbor}
    - {key: show_ip_bgp_summary, command: show ip bgp summary}
    - {key: show_ip_eigrp_neighbors, command: show ip eigrp neighbors}
    - {key: show_standby_brief, command: show standby brief}
    - {key: show_redundancy, command: show redundancy}
    - {key: show_switch, command: show switch}
    - {key: show_switch_stack_ports_summary, command: show switch stack-ports summary}
    - {key: dir, command: dir}
    - {key: show_flash_crash, command: "show flash: | include crash"}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco IOS operational outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"
