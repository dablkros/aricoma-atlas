---
- name: Initialize Cisco CBS operational command buffer
  ansible.builtin.set_fact:
    atlas_command_outputs: {}

- name: Collect Cisco CBS operational-health commands independently
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/common/run_cisco_cbs_command.yml"
  loop:
    - {key: show_clock, command: show clock}
    - {key: show_sntp_status, command: show sntp status}
    - {key: show_logging, command: show logging}
    - {key: show_ip_route, command: show ip route}
    - {key: show_ip_rip_peers, command: show ip rip peers}
    - {key: show_stack, command: show stack}
    - {key: show_stack_links, command: show stack links}
  loop_control:
    loop_var: atlas_command_spec
    label: "{{ atlas_command_spec.command }}"

- name: Prepare Cisco CBS operational outputs for Atlas normalization
  ansible.builtin.set_fact:
    atlas_transport_result:
      data: "{{ atlas_command_outputs }}"
