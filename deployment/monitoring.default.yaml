version: 2
# TEST-NET-1 is intentionally non-routable. Replace it with explicit customer
# management ranges before provisioning can contact a device.
allowed_device_networks:
  - 192.0.2.0/24
fortios:
  default_vdom: root
  default_https_port: 443
  default_snmp_port: 161
  tls_verify: true
  lab_tls_exception: false
monitoring: {}
# Set monitoring.source_ip to the Atlas/Zabbix egress IPv4 when deployment
# cannot determine and generate it safely.
