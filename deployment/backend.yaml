backend:
  version: "0.4.3"
  docker_image: "aricoma-atlas-backend:0.4.3"
  python_base_image: "docker.io/library/python:3.13.16-slim-bookworm"
  dockerfile: "deployment/backend/Dockerfile"
  environment: "production"
  log_level: "INFO"
  ansible_job_timeout: 120
  fortios_validate_certs: false
  ssh_strict_host_keys: false
  prophylaxis_result_retention: 10000
  prophylaxis_concurrency: 4

vpn_worker:
  docker_image: "aricoma-atlas-vpn-worker:0.4.3"
  dockerfile: "deployment/vpn/Dockerfile"
  connect_timeout: 45
  target_timeout: 5

runtime:
  directory: ".runtime/backend"
  compose_project: "atlas-backend"
  startup_timeout: 120

network:
  listen_address: "127.0.0.1"
  host_port: 8081
  container_port: 8000
