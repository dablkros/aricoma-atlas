# Compatibility template for manual proxy-only configuration.
# New installations should use deployment/site.example.yaml with
# `sudo atlasctl configure --site-file ...` so monitoring policy is generated too.
# No DNS names, certificates or management networks are assumed.
proxy:
  docker_image: "docker.io/library/nginx:1.30.5"
  listen_address: ""
  https_port: 443
  allowed_networks: []
tls:
  ca_certificate: ""
services:
  netbox:
    hostname: ""
    certificate: ""
    private_key: ""
  oxidized:
    hostname: ""
    certificate: ""
    private_key: ""
  zabbix:
    hostname: ""
    certificate: ""
    private_key: ""
