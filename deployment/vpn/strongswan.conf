charon {
    load_modular = yes
    install_routes = no

    # FortiGate IKEv2/EAP compatibility from the reviewed Atlas patch set.
    fortigate_auth_key = skp
    fortigate_suppress_eap_only = yes
    fortigate_send_forticlient_vid = yes

    plugins {
        include strongswan.d/charon/*.conf

        eap-identity { load = yes }
        eap-mschapv2 { load = yes }
        eap-gtc { load = yes }
        md4 { load = yes }
        vici { load = yes }
    }
}

# The worker writes Network ID, the per-attempt FCT path and the OTP bridge
# immediately before starting the isolated daemon.
include /run/atlas-vpn-worker/profile.conf

include strongswan.d/*.conf
