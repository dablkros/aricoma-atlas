        - "Aruba-6405*.yaml"
        - "Aruba-6410*.yaml"
        - "Aruba-8100-*.yaml"
        - "Aruba-8320-*.yaml"
        - "Aruba-8325-*.yaml"
        - "Aruba-8360-*.yaml"
        - "Aruba-8400.yaml"
        - "Aruba-10000-*.yaml"

    aruba_aos_switch:
      mode: patterns
      include:
        - "Aruba-2530-*.yaml"
        - "Aruba-2540-*.yaml"
        - "Aruba-2620-*.yaml"
        - "Aruba-2920-*.yaml"
