# Reviewed against the pinned Device Type Library; see docs/device-model.md.
# Matching happens ONLY while building/provisioning Device Types, never at runtime.
version: 1
platforms:
  cisco-ios: {name: Cisco IOS, manufacturer: Cisco}
  cisco-ios-xe: {name: Cisco IOS XE, manufacturer: Cisco}
  cisco-nxos: {name: Cisco NX-OS, manufacturer: Cisco}
  cisco-asa: {name: Cisco ASA, manufacturer: Cisco}
  cisco-cbs: {name: Cisco CBS, manufacturer: Cisco}
  cisco-cbs250-350: {name: Cisco CBS250/350, manufacturer: Cisco}
  fortios: {name: FortiOS, manufacturer: Fortinet}
  fortiap: {name: FortiAP, manufacturer: Fortinet}
  fortianalyzer: {name: FortiAnalyzer, manufacturer: Fortinet}
  junos: {name: Juniper Junos, manufacturer: Juniper}
  sophos-sfos: {name: Sophos Firewall OS, manufacturer: Sophos}
  sophos-ap: {name: Sophos Access Point, manufacturer: Sophos}
  sophos-red: {name: Sophos SD-RED, manufacturer: Sophos}
  aruba-aos-cx: {name: Aruba AOS-CX, manufacturer: HPE}
  aruba-aos-switch: {name: Aruba AOS-Switch, manufacturer: HPE}
  checkpoint-gaia: {name: Check Point Gaia, manufacturer: Check Point}
  checkpoint-gaia-embedded: {name: Check Point Gaia Embedded, manufacturer: Check Point}

# Explicit fields avoid confusing filenames, display models and slugs.
# Multiple matches to different platforms are an error, not first-match-wins.
platform_mappings:
  Cisco:
    - slugs: ['cisco-ws-c2960x-*', 'cisco-ws-c2960xr-*']
      platform: cisco-ios
    - slugs:
        - 'cisco-c9200-*'
        - 'cisco-c9200l-*'
        - 'cisco-c9200cx-*'
        - 'cisco-c9300-*'
        - 'cisco-c9300l-*'
        - 'cisco-c9300lm-*'
        - 'cisco-c9300x-*'
        - 'cisco-c9500-*'
        - 'cisco-c9500x-*'
        - 'cisco-ws-c3650-*'
        - 'cisco-ws-c3850-*'
        - 'cisco-catalyst-3850-48pt-12-mgig-plus-36-gig-upoe'
        - 'cisco-c8200-*'
        - 'cisco-c8300-*'
        - 'cisco-isr4221'
        - 'cisco-isr4321'
        - 'cisco-isr4331'
        - 'cisco-isr4351'
        - 'cisco-isr4431'
        - 'cisco-isr4451-x'
        - 'cisco-isr4461-x'
      platform: cisco-ios-xe
    - slugs: ['cisco-cbs220-*']
      platform: cisco-cbs
    - slugs: ['cisco-cbs250-*', 'cisco-cbs350-*']
      platform: cisco-cbs250-350
    # No Nexus selected by the current manifest; do not assume N9K implies NX-OS (ACI).
  Fortinet:
    - slugs: ['fortinet-fg-*', 'fortinet-fgr-*', 'fortinet-fortigate-7081f', 'fortinet-fortigate-7121f']
      platform: fortios
    - slugs: ['fortinet-fap-*']
      platform: fortiap
    - slugs: ['fortinet-faz-*']
      platform: fortianalyzer
  Juniper:
    - models:
        - 'EX2200-*'
        - 'EX2300-*'
        - 'EX3300-*'
        - 'EX3400-*'
        - 'EX4000-*'
        - 'EX4100-*'
        - 'EX4200-*'
        - 'EX4300-*'
        - 'EX4400-*'
        - 'EX4500-*'
        - 'EX4550-*'
        - 'EX4600-*'
        - 'EX9204'
        - 'EX9208'
        - 'EX9214'
        - 'MX[0-9]*'
        - 'QFX3500-*'
        - 'QFX5100-*'
        - 'QFX5110-*'
        - 'QFX5120-*'
        - 'QFX5200-*'
        - 'QFX5210-*'
        - 'QFX10002-*'
      platform: junos
    # ACX/PTX, newer QFX (Junos OS Evolved), AP, NFX, NetScreen and SRX
    # intentionally await a separate reviewed rule. No vendor-wide fallback.
  Sophos:
    - slugs: ['sophos-xg-*', 'sophos-xgs-*']
      platform: sophos-sfos
    - slugs: ['sophos-ap6-*', 'sophos-apx*']
      platform: sophos-ap
    - slugs: ['sophos-sd-red-*']
      platform: sophos-red
  HPE:
    - slugs:
        - 'hpe-aruba-5420'
        - 'hpe-aruba-6000-*'
        - 'hpe-aruba-6100-*'
        - 'hpe-aruba-6200f-*'
        - 'hpe-aruba-6200m-*'
        - 'hpe-aruba-6300f-*'
        - 'hpe-aruba-6300m-*'
        - 'hpe-aruba-6405*'
        - 'hpe-aruba-6410*'
        - 'hpe-aruba-8100-*'
        - 'hpe-aruba-8320-*'
        - 'hpe-aruba-8325-*'
        - 'hpe-aruba-8360-*'
        - 'hpe-aruba-8400'
        - 'hpe-aruba-10000-*'
      platform: aruba-aos-cx
    - slugs:
        - 'hpe-aruba-2530-*'
        - 'hpe-aruba-2540-*'
        - 'hpe-aruba-2620-*'
        - 'hpe-aruba-2920-*'
        - 'hpe-aruba-2930f-*'
        - 'hpe-aruba-2930m-*'
        - 'hpe-aruba-3810m-*'
        - 'hpe-aruba-5406r-*'
        - 'hpe-aruba-5412r-*'
      platform: aruba-aos-switch
    # Instant On, AP/IAP, mobility controllers, EdgeConnect and Comware are
    # deliberately excluded until each OS family has its own reviewed contract.
  Check Point:
    - slugs:
        - 'check-point-mho-140'
        - 'check-point-mho-175'
        - 'check-point-quantum-lightspeed-qls250'
        - 'check-point-sg3600'
        - 'check-point-sg3920'
        - 'check-point-sg3950'
        - 'check-point-sg3970'
        - 'check-point-sg3980'
        - 'check-point-sg6200'
        - 'check-point-sg6400'
        - 'check-point-sg6600'
        - 'check-point-sg7000'
        - 'check-point-sg9100'
        - 'check-point-sg9200'
        - 'check-point-sg9300'
        - 'check-point-sg9400'
        - 'check-point-sg9700'
        - 'check-point-sg9700-plus'
        - 'check-point-sg9800'
        - 'check-point-sg16000'
        - 'check-point-sg16200'
        - 'check-point-sg19100'
        - 'check-point-sg19200'
        - 'check-point-sg29100'
        - 'check-point-sg29200'
        - 'check-point-smart-1-600-m'
        - 'check-point-smart-1-6000-xl'
      platform: checkpoint-gaia
    - slugs:
        - 'check-point-sg1530'
        - 'check-point-sg1535'
        - 'check-point-sg1555'
        - 'check-point-sg1570'
        - 'check-point-sg1575'
        - 'check-point-sg1590'
        - 'check-point-sg1595'
        - 'check-point-sg1595r'
        - 'check-point-sg1600'
        - 'check-point-sg1800'
        - 'check-point-sg2000'
        - 'check-point-sg2530'
        - 'check-point-sg2550'
        - 'check-point-sg2560'
        - 'check-point-sg2570'
        - 'check-point-sg2580'
      platform: checkpoint-gaia-embedded
    # Rack shelves, SandBlast appliances and older gateway families are not
    # imported until their OS family is verified against a current source.

oxidized:
  image: docker.io/oxidized/oxidized:0.37.0
  source_commit: 3ff7335d85592993727f7dfa7a98cd70aedb87b0
oxidized_platform_mapping:
  cisco-ios: {model: ios}
  cisco-ios-xe: {model: ios}
  cisco-nxos: {model: nxos}
  cisco-cbs: {model: ciscosmb}
  cisco-cbs250-350: {model: ciscosmb}
  fortios: {model: fortigate}
  junos: {model: junos}
  aruba-aos-cx: {model: aoscx}
  aruba-aos-switch: {model: procurve}
  checkpoint-gaia: {model: gaiaos}
# CBS uses the pinned ciscosmb model, but remains experimental until each target
# family is validated against physical hardware. FortiAP and hardware
# FortiAnalyzer remain unmapped pending driver/hardware validation.
# Sophos platforms are inventory/monitoring identities only; no unverified
# Oxidized model is assigned.
# Check Point Gaia uses the pinned gaiaos model and a read-only Gaia Clish
# prophylaxis collector. Gaia Embedded remains unmapped until its command set
# is verified on physical Spark hardware.
